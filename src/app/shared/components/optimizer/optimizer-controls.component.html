<div class="controls-row">

  <div class="control-group">
    <label for="cat-select" class="control-label">Métier</label>
    <select
      id="cat-select"
      [ngModel]="selectedCatId()"
      (ngModelChange)="categoryChange.emit($event)"
      class="control-select"
      aria-label="Sélectionner un métier"
    >
      <option [ngValue]="null">— Choisir un métier —</option>
      @for (cat of craftCategories(); track cat.id) {
        <option [ngValue]="cat.id">{{ cat.name['fr'] }}</option>
      }
    </select>
  </div>

  <div class="control-group">
    <label for="level-input" class="control-label">Niveau du métier</label>
    <input
      id="level-input"
      type="number"
      min="1"
      max="230"
      class="control-input"
      [ngModel]="playerLevel()"
      (ngModelChange)="levelChange.emit(+$event || 1)"
      aria-label="Niveau actuel du métier"
    />
  </div>

  <div class="control-group">
    <span class="control-label" id="sort-label">Classer par</span>
    <div class="sort-toggle" role="group" aria-labelledby="sort-label">
      @for (opt of sortOptions(); track opt.value) {
        <button
          [class.active]="sortMode() === opt.value"
          (click)="sortModeChange.emit(opt.value)"
          [attr.aria-pressed]="sortMode() === opt.value"
        >{{ opt.label }}</button>
      }
    </div>
  </div>

  @if (selectedCatId()) {
    <button class="btn-refresh" (click)="refresh.emit()" aria-label="Rafraîchir les prix">
      ↺ Prix
    </button>
  }

</div>

<p class="sort-hint" [innerHTML]="sortHint()"></p>
